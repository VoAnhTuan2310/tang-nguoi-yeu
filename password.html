<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <p>Nhập ngày sinh của bạn.......</p>
        <input type="password" id="passInput" style="text-align:center; padding:10px; border-radius:10px; border:none; margin:10px 0;" disabled>
        <div class="keypad" id="keypad">
            <script>
                for(let i=1; i<=9; i++) document.write(`<div class="key" onclick="addNumber(${i})">${i}</div>`);
            </script>
            <div class="key" onclick="clearPass()">C</div>
            <div class="key" onclick="addNumber(0)">0</div>
            <div class="key" onclick="checkPass()">✓</div>
        </div>
    </div>

    <script>
        let correctPass = "160306"; // Anh Tuấn sửa ngày sinh ở đây
        function addNumber(n) { document.getElementById('passInput').value += n; }
        function clearPass() { document.getElementById('passInput').value = ""; }
        function checkPass() {
            if(document.getElementById('passInput').value === correctPass) {
                window.location.href = 'card.html';
            } else {
                alert("Sai ngày sinh rồi Cún iuuu!");
                clearPass();
            }
        }
    </script>
</body>
</html>
