<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Happy Birthday Cún Iuuu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Quicksand', sans-serif; width: 100vw; height: 100vh; }
        #rotate-notice {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; color: #fff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        #main-wrapper { display: none; width: 100vw; height: 100vh; position: relative; }
        canvas { position: absolute; top: 0; left: 0; display: block; }
        #text-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; width: 90%; pointer-events: none; text-align: center;
        }
        .message { 
            font-family: 'Dancing Script', cursive; font-size: clamp(1.8rem, 8vw, 3.2rem); 
            color: #ffffff; text-shadow: 0 0 15px rgba(255, 255, 255, 0.8); line-height: 1.4;
        }
        @media screen and (orientation: landscape) { #rotate-notice { display: none; } #main-wrapper { display: flex; } }
    </style>
</head>
<body>
    <div id="rotate-notice"><p>Mời Cún iu xoay ngang điện thoại ❤️</p></div>
    <div id="main-wrapper">
        <canvas id="canvas"></canvas>
        <div id="text-overlay"><div id="text" class="message"></div></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const textElement = document.getElementById('text');
        let width, height, hearts = [], backgroundItems = [];
        const messages = ["3", "2", "1", "Hôm nay là ngày đặc biệt của em...", "HAPPY BIRTHDAY CÚN IUUU 🎂", "Chúc em luôn xinh đẹp và hạnh phúc nhó", "Út Cún Cún :3 ❤️"];
        let currentMsgIndex = 0, isFinalStage = false;

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);
            initItems();
        }

        function initItems() {
            hearts = [];
            for (let i = 0; i < 300; i++) {
                hearts.push({
                    x: Math.random() * width, y: Math.random() * height,
                    size: Math.random() * 8 + 10,
                    angle: (i / 300) * Math.PI * 2,
                    opacity: Math.random(),
                    drift: Math.random() * 10 - 5
                });
            }
            backgroundItems = [];
            for (let i = 0; i < 20; i++) {
                backgroundItems.push({
                    x: Math.random() * width, y: Math.random() * height,
                    icon: ['🎂', '🌸', '🎁', '💖', '✨'][Math.floor(Math.random() * 5)],
                    speed: Math.random() * 1.5 + 1.5,
                    size: Math.random() * 18 + 15
                });
            }
        }

        function typeWriter(text, i, fnCallback) {
            if (i < text.length) {
                textElement.innerHTML = text.substring(0, i + 1);
                setTimeout(() => typeWriter(text, i + 1, fnCallback), 40); 
            } else if (typeof fnCallback == 'function') {
                setTimeout(fnCallback, 1000); 
            }
        }

        function startTextSequence() {
            if (currentMsgIndex < messages.length) {
                if (currentMsgIndex === messages.length - 1) isFinalStage = true;
                typeWriter(messages[currentMsgIndex], 0, () => {
                    currentMsgIndex++;
                    startTextSequence();
                });
            }
        }

        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * scale, y: y * scale };
        }

        function animate() {
            // Xóa sạch để hết sọc dọc
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            backgroundItems.forEach(item => {
                ctx.globalAlpha = 0.8;
                ctx.font = `${item.size}px Arial`;
                ctx.textAlign = "center";
                ctx.fillText(item.icon, item.x, item.y);
                item.y += item.speed;
                if (item.y > height + 20) { item.y = -20; item.x = Math.random() * width; }
            });

            hearts.forEach((h, i) => {
                if (isFinalStage) {
                    const scale = Math.min(width, height) / 38;
                    const pos = getHeartPoint(h.angle, scale);
                    h.x += (width/2 + pos.x + h.drift - h.x) * 0.12;
                    h.y += (height/2 + pos.y + h.drift - h.y) * 0.12;
                    h.opacity = 0.6 + Math.sin(Date.now() * 0.005 + i) * 0.4;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = "#ff1493";
                } else {
                    h.y += 3;
                    if (h.y > height) h.y = -20;
                    ctx.shadowBlur = 0;
                }
                ctx.globalAlpha = h.opacity;
                ctx.font = `${h.size}px Arial`;
                ctx.fillText("❤️", h.x, h.y);
            });
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();

        let started = false;
        setInterval(() => {
            if (window.innerWidth > window.innerHeight && !started) {
                started = true;
                setTimeout(startTextSequence, 500);
            }
        }, 400);
    </script>
</body>
</html>
