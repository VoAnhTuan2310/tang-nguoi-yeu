<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Cún Iuuu ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #000;
            overflow: hidden; 
            font-family: 'Quicksand', sans-serif;
            width: 100vw;
            height: 100vh;
        }

        /* Khung thông báo xoay ngang - Fix cứng cho mobile */
        #rotate-notice {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #fff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            padding: 20px; text-align: center;
        }
        .phone-icon { 
            width: 40px; height: 70px; border: 3px solid #ff4d4d; border-radius: 6px; 
            animation: rotateDevice 2s infinite; position: relative; margin-bottom: 20px;
        }
        .phone-icon::after {
            content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
            width: 8px; height: 8px; border: 1px solid #ff4d4d; border-radius: 50%;
        }
        @keyframes rotateDevice {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(90deg); }
        }

        /* Khung chứa nội dung chính - Căn giữa tuyệt đối */
        #main-wrapper {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            justify-content: center;
            align-items: center;
        }

        canvas { position: absolute; top: 0; left: 0; }
        
        #text-overlay {
            position: relative;
            z-index: 10;
            width: 85%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .message { 
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.8rem, 8vw, 3.5rem); /* Tự động co giãn theo cỡ màn hình */
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 30px rgba(255, 105, 180, 0.6);
            line-height: 1.4;
        }

        /* Hiện nội dung khi xoay ngang */
        @media screen and (orientation: landscape) {
            #rotate-notice { display: none; }
            #main-wrapper { display: flex; }
        }
    </style>
</head>
<body>

    <div id="rotate-notice">
        <div class="phone-icon"></div>
        <p>Anh Tuấn mời Cún iu xoay ngang điện thoại ❤️</p>
    </div>

    <div id="main-wrapper">
        <canvas id="canvas"></canvas>
        <div id="text-overlay">
            <div id="text" class="message"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const textElement = document.getElementById('text');
        
        let width, height, hearts = [], backgroundItems = [];
        const messages = ["3", "2", "1", "Hôm nay là ngày đặc biệt của em...", "HAPPY BIRTHDAY CÚN IUUU 🎂", "Chúc em luôn xinh đẹp và hạnh phúc nhó", "Út Cún Cún :3 ❤️"];
        let currentMsgIndex = 0;
        let isFinalStage = false;

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            // Khởi tạo trái tim nhỏ xếp khung
            hearts = [];
            for (let i = 0; i < 400; i++) {
                hearts.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 12 + 10,
                    opacity: Math.random(),
                    angle: (i / 400) * Math.PI * 2,
                    drift: Math.random() * 20 - 10
                });
            }

            // Vật phẩm nền
            backgroundItems = [];
            for (let i = 0; i < 30; i++) {
                backgroundItems.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    icon: ['🎂', '🌸', '🎁', '💖', '✨'][Math.floor(Math.random() * 5)],
                    speed: Math.random() * 2 + 2,
                    size: Math.random() * 20 + 15
                });
            }
        }

        function typeWriter(text, i, fnCallback) {
            if (i < text.length) {
                textElement.innerHTML = text.substring(0, i + 1);
                setTimeout(() => typeWriter(text, i + 1, fnCallback), 40); 
            } else if (typeof fnCallback == 'function') {
                setTimeout(fnCallback, 1000); 
            }
        }

        function startTextSequence() {
            if (currentMsgIndex < messages.length) {
                if (currentMsgIndex === messages.length - 1) isFinalStage = true;
                typeWriter(messages[currentMsgIndex], 0, () => {
                    currentMsgIndex++;
                    startTextSequence();
                });
            }
        }

        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * scale, y: y * scale };
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            backgroundItems.forEach(item => {
                ctx.font = `${item.size}px Arial`;
                ctx.fillText(item.icon, item.x, item.y);
                item.y += item.speed;
                if (item.y > height + 20) { item.y = -20; item.x = Math.random() * width; }
            });

            hearts.forEach((h, i) => {
                if (isFinalStage) {
                    // Căn chỉnh tỉ lệ trái tim theo màn hình
                    const scale = Math.min(width, height) / 30;
                    const pos = getHeartPoint(h.angle, scale);
                    const destX = width / 2 + pos.x + h.drift;
                    const destY = height / 2 + pos.y + h.drift;
                    
                    h.x += (destX - h.x) * 0.1;
                    h.y += (destY - h.y) * 0.1;
                    h.opacity = 0.5 + Math.sin(Date.now() * 0.005 + i) * 0.5;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "rgba(255, 105, 180, 0.8)";
                } else {
                    h.y += 2.5;
                    if (h.y > height) h.y = -20;
                }
                ctx.globalAlpha = h.opacity;
                ctx.font = `${h.size}px Arial`;
                ctx.fillText("❤️", h.x, h.y);
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { init(); });
        init();
        animate();

        let started = false;
        function check() {
            if (window.innerWidth > window.innerHeight && !started) {
                started = true;
                setTimeout(startTextSequence, 500);
            }
        }
        setInterval(check, 400);
    </script>
</body>
</html>
