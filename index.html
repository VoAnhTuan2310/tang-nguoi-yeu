<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn hình khóa tình yêu ❤️</title>
    <link rel="stylesheet" href="style_index.css">
</head>
<body>
    <div class="floating-icons" id="iconsContainer"></div>

    <div class="main-card">
        <div class="image-section">
            <img src="img/cun1.jpg" alt="Cún Iuuu" class="side-photo">
        </div>

        <div class="password-section">
            <p class="title-text">Nhập ngày sinh của bạn...</p>
            <input type="password" id="passInput" class="pass-display" placeholder="••••••" readonly>
            
            <div class="keypad">
                <script>
                    // Tự động tạo nút từ 1 đến 9
                    for(let i=1; i<=9; i++) document.write(`<div class="key" onclick="addNumber(${i})">${i}</div>`);
                </script>
                <div class="key btn-clear" onclick="clearPass()">C</div>
                <div class="key" onclick="addNumber(0)">0</div>
                <div class="key btn-check" onclick="checkPass()">✓</div>
            </div>
        </div>
    </div>

    <script>
        let correctPass = "160306"; // Ngày sinh của Út Cún Cún

        function addNumber(n) { 
            const input = document.getElementById('passInput');
            if(input.value.length < 6) input.value += n; 
        }
        function clearPass() { document.getElementById('passInput').value = ""; }
        function checkPass() {
            if(document.getElementById('passInput').value === correctPass) {
                window.location.href = 'card.html'; 
            } else {
                alert("Sai ngày sinh rồi Cún iuuu!");
                clearPass();
            }
        }

        // Hiệu ứng icon bay từ dưới lên
        function createIcons() {
            const container = document.getElementById('iconsContainer');
            const icons = ['❤️', '🎂', '💖', '✨', '🌸'];
            for (let i = 0; i < 30; i++) {
                let span = document.createElement('span');
                span.innerText = icons[Math.floor(Math.random() * icons.length)];
                span.style.left = Math.random() * 100 + 'vw';
                span.style.animationDuration = (Math.random() * 3 + 5) + 's';
                span.style.opacity = Math.random();
                span.className = 'floating-icon';
                container.appendChild(span);
            }
        }
        createIcons();
    </script>
</body>
</html>
